name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          scripts\setup-deps.ps1

      - name: Build
        shell: pwsh
        run: scripts\build.ps1

      - name: Unit tests
        shell: pwsh
        run: build\bin\vv_unit_tests.exe

      - name: End-to-end (synthetic sources; the runner has no GPU, screen or audio devices)
        shell: pwsh
        run: python tests\e2e\run_e2e.py --only synthetic_basic,pause_resume,errors

      - name: Keep the e2e report
        if: always()
        shell: pwsh
        run: Copy-Item "$env:TEMP\vv-e2e\report.json" dist-report.json -ErrorAction SilentlyContinue

      - name: Package
        shell: pwsh
        run: scripts\package.ps1 -SkipBuild

      - name: Installers
        shell: pwsh
        run: python tests\e2e\run_e2e.py --only installers

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voloire-video
          path: |
            dist/*.exe
            dist/*.msi
            dist-report.json
          if-no-files-found: ignore
