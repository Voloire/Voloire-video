name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      media_tests:
        description: Run the optional audio/video and installer suites
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          scripts\setup-deps.ps1

      - name: Build
        shell: pwsh
        run: scripts\build.ps1

      - name: Functional unit tests (no audio/video or devices)
        shell: pwsh
        run: build\bin\vv_unit_tests.exe '--test-suite=functional'

      - name: Headless functional flows (local fake APIs, no capture or browser)
        shell: pwsh
        run: python tests\functional_tests.py

      - name: Functional destination UI (offscreen, no audio/video or devices)
        shell: pwsh
        run: build\bin\vv_ui_functional_tests.exe

      - name: Full unit suite (optional media validation)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.media_tests }}
        shell: pwsh
        run: build\bin\vv_unit_tests.exe

      - name: End-to-end (synthetic sources; the runner has no GPU, screen or audio devices)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.media_tests }}
        shell: pwsh
        run: python tests\e2e\run_e2e.py --only harness_selftest,synthetic_basic,pause_resume,errors,quality_presets,share_copy,stream_rtmp,stream_unreachable

      - name: Keep the e2e report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.media_tests }}
        shell: pwsh
        run: Copy-Item "$env:TEMP\vv-e2e\report.json" dist-report.json -ErrorAction SilentlyContinue

      - name: Package
        shell: pwsh
        run: scripts\package.ps1 -SkipBuild

      - name: Installers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.media_tests }}
        shell: pwsh
        run: python tests\e2e\run_e2e.py --only installers

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voloire-video
          path: |
            dist/*.exe
            dist/*.msi
            dist-report.json
          if-no-files-found: ignore
